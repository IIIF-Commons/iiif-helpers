name: Release NPM package

on:
  push:
    tags: ["v*"]
  pull_request:
    types: [closed]

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == github.event.repository.default_branch &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref == 'release/next')
    runs-on: ubuntu-latest
    name: Build and check release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.13.0
          run_install: false

      - name: Check tag matches package version
        if: github.event_name == 'push'
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Git tag must match package.json version (v$version)"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run fmt:check
      - run: pnpm run lint
      - run: pnpm run lint:pkg
      - run: pnpm exec vitest run
      - run: node pkg-tests/node-load.cjs
      - run: node pkg-tests/node-load.mjs

  release:
    needs: [build]
    runs-on: ubuntu-latest
    name: Publish and create release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.x"
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 11.13.0
          run_install: false

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm run build

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Publish to npm with provenance
        run: |
          version=$(node -p "require('./package.json').version")
          if [[ "$version" == *-* ]]; then
            dist_tag=next
          else
            dist_tag=latest
          fi
          npm publish --access public --provenance --ignore-scripts \
            --registry https://registry.npmjs.org --tag "$dist_tag"

      - name: Create GitHub release and tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          args=()
          if [[ "$version" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "v$version" --target "$(git rev-parse HEAD)" \
            --title "v$version" --generate-notes "${args[@]}"
